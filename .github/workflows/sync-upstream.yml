name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时检查一次
  workflow_dispatch:        # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || echo "Already up to date"
          git push origin main
